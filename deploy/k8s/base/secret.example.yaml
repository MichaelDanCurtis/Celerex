# Template documenting the keys celerex-secrets must carry. DO NOT put real
# values here or commit a populated copy. up.sh generates the real Secret.
apiVersion: v1
kind: Secret
metadata:
  name: celerex-secrets
  namespace: celerex
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgres://celerex:CHANGE_ME@celerex-postgres:5432/celerex"
  CELEREX_CRED_KEY: "CHANGE_ME_32_BYTES"
  CELEREX_JWT_SECRET: "CHANGE_ME"
