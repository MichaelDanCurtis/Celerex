apiVersion: apps/v1
kind: Deployment
metadata:
  name: celerex-agent
  namespace: celerex
spec:
  replicas: 1
  selector:
    matchLabels: { app: celerex-agent }
  template:
    metadata:
      labels: { app: celerex-agent }
    spec:
      containers:
        - name: agent
          image: celerex-agent:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3001 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: celerex-secrets, key: DATABASE_URL } }
            - name: CELEREX_CRED_KEY
              valueFrom: { secretKeyRef: { name: celerex-secrets, key: CELEREX_CRED_KEY } }
            - name: CELEREX_JWT_SECRET
              valueFrom: { secretKeyRef: { name: celerex-secrets, key: CELEREX_JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /api/providers, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/providers, port: 3001 }
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: celerex-agent
  namespace: celerex
spec:
  type: NodePort
  selector: { app: celerex-agent }
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001
