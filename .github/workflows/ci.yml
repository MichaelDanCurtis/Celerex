name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The typecheck gate (scripts/typecheck.mjs) runs the workspace tsc via
      # `node`, so make sure a modern Node is present alongside Bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile fails the build if bun.lock is out of date with the
      # package.json manifests, keeping CI reproducible.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Gate on FIRST-PARTY type errors only. BlockSuite/Affine ships raw .ts as
      # its types, so ~20 vendored errors are reported-but-suppressed; any error
      # in our own src/ fails the job. See docs/RUNNING_CELEREX_FLOW.md.
      - name: Typecheck (first-party)
        run: bun run --filter @celerex/app typecheck

      - name: Unit tests
        run: bun run --filter @celerex/app test

      - name: Production build
        run: bun run --filter @celerex/app build

# NOTE: there is intentionally no backend (cargo) job. packages/backend/api has
# path dependencies on a sibling repo (../../../../lucidity/Galvo/engine/*) that is
# not part of this repository, so `cargo build/test` cannot resolve the workspace
# in a clean CI checkout. Backend CI requires either vendoring those crates or
# making the Galvo federation deps optional/feature-gated first.
